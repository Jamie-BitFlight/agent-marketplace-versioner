name: Update README

on:
  push:
    branches: [main]
    paths: [action.yml]
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: bitflight-devops/github-action-readme-generator@ab53331dcdc69958675cc61d400a5700d3ac7eec # v1.12.8
      - name: Remove generated trailing whitespace
        run: sed -i 's/[[:space:]]*$//' README.md
      - uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # v6
        with:
          commit_message: "docs: regenerate README"
          file_pattern: README.md .github/ghadocs/
